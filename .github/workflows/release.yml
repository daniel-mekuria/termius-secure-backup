name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: termius-backup
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: termius-backup
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: termius-backup.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          # The binary inside every archive ships under a clean, platform-
          # independent name ("termius-backup" / "termius-backup.exe") so a
          # user extracting it gets a sensible binary regardless of platform.
          # The platform/target is encoded in the *archive* filename instead.
          bin="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          archive="termius-backup-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p stage
          cp "$bin" "stage/${{ matrix.artifact }}"
          case "${{ matrix.target }}" in
            *pc-windows-msvc)
              (cd stage && 7z a "../${archive}.zip" "${{ matrix.artifact }}")
              ;;
            *)
              (cd stage && tar czf "../${archive}.tar.gz" "${{ matrix.artifact }}")
              ;;
          esac
          # Checksum sidecar for whichever archives exist on this platform.
          # (Each line is an `&&` list so a missing file short-circuits
          # without tripping `set -e`; the file is pre-created so it always
          # exists even if neither archive is produced.)
          : > "${archive}.sha256"
          [ -f "${archive}.tar.gz" ] && sha256sum "${archive}.tar.gz" >> "${archive}.sha256"
          [ -f "${archive}.zip" ]   && sha256sum "${archive}.zip"   >> "${archive}.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: termius-backup-${{ matrix.target }}
          path: |
            termius-backup-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            termius-backup-${{ github.ref_name }}-${{ matrix.target }}.zip
            termius-backup-${{ github.ref_name }}-${{ matrix.target }}.sha256
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: List assets
        run: ls -R assets
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            assets/*.tar.gz
            assets/*.zip
            assets/*.sha256
